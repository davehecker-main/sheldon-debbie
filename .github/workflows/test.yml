name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/install.sh
      - run: node tests/frontmatter.mjs
      - run: sh tests/profile-selection.sh
      - run: node tests/contracts.mjs
      - run: node --test tests/consult-wire.mjs
